<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Estante</title>
  <meta name="description" content="Registra los libros que tienes y los que has leído. En la librería, escanea el código de barras y sabrás si ya lo tienes.">
  <meta name="theme-color" content="#1E5A48" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111715" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Estante">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Mi Estante</h1>
      <div class="stats" id="stats">Abriendo tu estante…</div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view"></main>
  </div>

  <!-- Camera view: shown while scanning -->
  <div id="scanner" class="scanner" hidden>
    <video id="video" playsinline muted></video>
    <div class="reticle" aria-hidden="true"><div class="laser"></div></div>
    <div class="scan-top">
      <div id="scan-title" class="scan-title">Apunta al código de barras</div>
      <div class="scan-hint">El ISBN empieza por 978 o 979, normalmente en la contraportada. Si no hay código de barras, pulsa «Escribir el ISBN».</div>
    </div>
    <div class="scan-bottom">
      <div id="bulk-panel" hidden>
        <label class="bulk-toggle" for="bulk-read"><input type="checkbox" id="bulk-read"> Añadir como leídos</label>
        <div id="bulk-log" class="bulk-log"></div>
      </div>
      <div id="scan-msg" class="scan-msg" role="status"></div>
      <div class="scan-actions">
        <button type="button" id="torch" class="btn scan-btn" hidden>Linterna</button>
        <button type="button" id="scan-type" class="btn scan-btn">Escribir el ISBN</button>
        <button type="button" id="scan-close" class="btn scan-btn primary">Cerrar</button>
      </div>
    </div>
  </div>

  <input type="file" id="photo-code" accept="image/*" capture="environment" class="visually-hidden" tabindex="-1">
  <input type="file" id="import-file" accept="application/json,.json" class="visually-hidden" tabindex="-1">
  <input type="file" id="cover-file" accept="image/*" capture="environment" class="visually-hidden" tabindex="-1">

  <nav class="tabs" aria-label="Secciones">
    <div class="in">
      <button type="button" data-tab="scan" id="tab-scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 8v8M11 8v8M13.5 8v8M16 8v8"/></svg>
        Escanear</button>
      <button type="button" data-tab="library" id="tab-library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h3v16H4zM9 4h3v16H9z"/><path d="m14.5 5.2 2.9-.8 3.6 15-2.9.8z"/></svg>
        Mi estante</button>
      <button type="button" data-tab="add" id="tab-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        Añadir</button>
      <button type="button" data-tab="more" id="tab-more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Exportar</button>
    </div>
  </nav>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="vendor/zxing-0.21.3.min.js" defer></script>
  <script src="js/lib.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/lookup.js" defer></script>
  <script src="js/scanner.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
